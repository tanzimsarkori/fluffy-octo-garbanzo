name: Build YASIR DIAG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/bosch-v14-3-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build Yasir Diag 2.6.9 APK
        run: gradle --no-daemon assembleDebug
      - name: Upload Yasir Diag 2.6.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: YASIR-DIAG-v2.6.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
